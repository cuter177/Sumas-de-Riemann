name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag a publicar (ej. v2.1). Vacío = solo compilar sin release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Checkout (con tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        id: compute
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            latest=$(git tag -l 'v*' | sort -V | tail -n1)
            if [ -z "$latest" ]; then
              TAG="v1.0"
            else
              major=$(echo "$latest" | sed -E 's/^v([0-9]+)\..*/\1/')
              minor=$(echo "$latest" | sed -E 's/^v[0-9]+\.([0-9]+).*/\1/')
              TAG="v${major}.$((minor + 1))"
            fi
            # Si el tag ya existe (carreras entre merges), sube el minor.
            while git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; do
              major=$(echo "$TAG" | sed -E 's/^v([0-9]+)\..*/\1/')
              minor=$(echo "$TAG" | sed -E 's/^v[0-9]+\.([0-9]+).*/\1/')
              TAG="v${major}.$((minor + 1))"
            done
          else
            TAG=""
          fi

          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computado: tag='$TAG' version='$VERSION'"

  build-windows:
    needs: [version]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Ensure Maven
        shell: pwsh
        run: |
          if (-not (Get-Command mvn -ErrorAction SilentlyContinue)) {
            choco install maven -y --no-progress
          }
          mvn -v

      - name: Set up MSYS2 (MinGW-w64 + freeglut)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-make
            mingw-w64-x86_64-freeglut

      - name: Build portable release
        shell: pwsh
        run: |
          ./empaquetar.ps1 -CmakeGenerator Ninja

      - name: Package artifact
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $zip = "Riemann-windows-$env:VERSION.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Move-Item "Riemann-portable.zip" $zip
          Get-ChildItem $zip | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: riemann-windows
          path: Riemann-windows-*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [version, build-windows]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Riemann ${{ needs.version.outputs.tag }}
          files: artifacts/*.zip
          generate_release_notes: true
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
